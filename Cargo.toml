[package]
name = "sanitized"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
trash = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }
yara-x = { version = "1", default-features = false, features = ["macho-module", "hash-module", "math-module", "string-module", "time-module", "constant-folding", "fast-regexp"] }
rsa = { version = "=0.10.0", default-features = false, features = ["pkcs1v15"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
tray-icon = { version = "0.26", default-features = false }

[profile.release]
opt-level = 2
